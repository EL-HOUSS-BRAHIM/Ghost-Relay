name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Install dependencies
        run: npm install
        
      - name: Build Tauri app
        run: npm run build
        
      - name: Create portable Windows package
        shell: pwsh
        run: |
          $exePath = Get-ChildItem -Path "src-tauri\target\release" -Filter "ghost-relay.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if ($exePath) {
            New-Item -ItemType Directory -Force -Path "portable-windows"
            Copy-Item $exePath "portable-windows\Ghost-Relay.exe"
            Compress-Archive -Path "portable-windows\*" -DestinationPath "Ghost-Relay-Portable-Windows.zip"
          }
          
      - name: Upload portable Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-windows
          path: Ghost-Relay-Portable-Windows.zip
          
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf
          
      - name: Install dependencies
        run: npm install
        
      - name: Build Tauri app
        run: npm run build
        
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        
      - name: Display structure of downloaded files
        run: ls -R
        
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            portable-windows/*.zip
            windows-installers/**/*.exe
            windows-installers/**/*.msi
            linux-packages/**/*.AppImage
            linux-packages/**/*.deb
            linux-packages/**/*.rpm
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
