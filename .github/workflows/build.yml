name: Build

on:
  push:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install frontend deps
        run: npm install
      - name: Build Tauri (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy artifacts
        run: |
          mkdir -p artifacts
          cp -r src-tauri/target/release/bundle/* artifacts/
          ls -R artifacts/
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ghost-relay-linux
          path: artifacts/**/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install frontend deps
        run: npm install
      - name: Build Tauri (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Debug - Check what exists
        run: |
          Write-Host "Current directory:"
          Get-Location
          Write-Host "Listing target folder:"
          Get-ChildItem -Path "src-tauri\target" -Recurse -Depth 2 | Select-Object FullName
          Write-Host "Checking if bundle exists:"
          Test-Path "src-tauri\target\release\bundle"
        shell: powershell
      - name: Copy artifacts
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          if (Test-Path "src-tauri\target\release\bundle") {
            Copy-Item -Path "src-tauri\target\release\bundle\*" -Destination "artifacts" -Recurse
          } else {
            Write-Host "Bundle folder not found!"
          }
          Get-ChildItem -Recurse artifacts
        shell: powershell
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ghost-relay-windows
          path: artifacts/**/*
