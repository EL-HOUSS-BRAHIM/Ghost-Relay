name: Build

on:
  push:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install frontend deps
        run: npm install
      - name: Build Tauri (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: List build outputs
        run: |
          echo "Checking appimage folder:"
          ls -la src-tauri/target/release/bundle/appimage/ || echo "appimage folder not found"
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-relay-linux
          path: src-tauri/target/release/bundle/appimage/*.AppImage

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install frontend deps
        run: npm install
      - name: Build Tauri (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: List build outputs
        run: |
          echo "Checking msi folder:"
          ls -la src-tauri/target/release/bundle/msi/ || echo "msi folder not found"
          echo "Checking nsis folder:"
          ls -la src-tauri/target/release/bundle/nsis/ || echo "nsis folder not found"
        shell: bash
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-relay-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
