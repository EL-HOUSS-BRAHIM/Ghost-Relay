name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-beta.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 0.1.4-beta.1)'
        required: true
        type: string
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - linux
          - windows
      linux_format:
        description: 'Linux format (for linux builds only)'
        required: false
        type: choice
        default: 'all'
        options:
          - all
          - appimage
          - deb
          - rpm

jobs:
  build-linux:
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.platform == 'linux' || inputs.platform == 'all')) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        format: [appimage, deb, rpm]
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install frontend deps
        run: npm install
      
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi
      
      - name: Update version
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
      
      - name: Set build target
        run: |
          FORMAT="${{ matrix.format }}"
          sed -i "s/\"targets\": \[.*\]/\"targets\": [\"$FORMAT\"]/" src-tauri/tauri.conf.json
      
      - name: Build Tauri app
        run: npm run tauri build
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghost-relay-${{ steps.version.outputs.VERSION }}-linux-${{ matrix.format }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  build-windows:
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.platform == 'windows' || inputs.platform == 'all')) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install frontend deps
        run: npm install
      
      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi
      
      - name: Update version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
      
      - name: Set build target
        shell: bash
        run: |
          sed -i 's/"targets": \[.*\]/"targets": ["nsis"]/' src-tauri/tauri.conf.json
      
      - name: Build Tauri app
        run: npm run tauri build
      
      - name: Upload NSIS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghost-relay-${{ steps.version.outputs.VERSION }}-windows-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
      
      # Upload standalone portable executable (always built by Tauri)
      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: ghost-relay-${{ steps.version.outputs.VERSION }}-windows-exe
          path: src-tauri/target/release/ghost-relay.exe

  create-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Display structure of downloaded files
        run: ls -R artifacts/
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.exe
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
