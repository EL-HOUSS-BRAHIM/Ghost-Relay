name: Ghost Relay Master Build

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger button in GitHub Actions

jobs:
  # JOB 1: DESKTOP (Windows & Linux)
  desktop-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build & Upload (Desktop)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # This auto-tags releases
          releaseName: 'Ghost Relay v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false

  # JOB 2: ANDROID (The Cloud Builder)
  android-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node & Rust
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install Dependencies
        run: |
          npm install
          cargo install tauri-cli --version "^2.0.0-beta" || cargo install tauri-cli # Install CLI if missing
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Initialize Android & Inject Permissions
        run: |
          # 1. Init Android (Non-interactive)
          cargo tauri android init
          
          # 2. Inject Permissions using the script we created
          chmod +x scripts/inject_perms.sh
          ./scripts/inject_perms.sh

      - name: Build APK (Debug)
        run: cargo tauri android build --apk --target aarch64-linux-android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-relay-android-arm64
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          if-no-files-found: warn
          # Fallback path if universal isn't generated
          # path: src-tauri/gen/android/app/build/outputs/apk/debug/app-debug.apk 
