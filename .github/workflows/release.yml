name: Ghost Relay Master Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # JOB 1: DESKTOP (Windows Portable & Linux AppImage)
  desktop-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 20 }
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      # Build & Upload Bundles (AppImage / Setup.exe)
      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Ghost Relay v__VERSION__'
          releaseDraft: true
          prerelease: false

      # SPECIAL STEP: Upload Raw Portable EXE (Windows Only)
      - name: Upload Portable Windows Binary
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ghost-relay-portable-windows
          # This grabs the actual executable, not the installer
          path: src-tauri/target/release/ghost-relay.exe
          if-no-files-found: warn

  # JOB 2: ANDROID (Cloud Builder)
  android-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Environment
        uses: actions/setup-java@v4
        with: { distribution: 'corretto', java-version: '17' }
        
      - uses: android-actions/setup-android@v3
      
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
        
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install Dependencies
        run: |
          npm install
          cargo install tauri-cli --version "^2.0.0-beta" || cargo install tauri-cli
          sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.0-dev build-essential

      - name: Init & Inject Permissions
        run: |
          cargo tauri android init
          chmod +x scripts/inject_perms.sh
          ./scripts/inject_perms.sh

      - name: Build APK
        run: cargo tauri android build --apk --target aarch64-linux-android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ghost-relay-android
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk 
