[package]
name = "ghost-relay"
version = "0.2.9"
edition = "2021"

[dependencies]
tauri = { version = "1", features = [ "fs-all", "path-all", "http-all", "shell-all", "clipboard-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
